<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your listings — Corridor</title>
  <meta name="description" content="Upload a listing. See the ones we are working on." />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'&gt;&lt;path d='M2 1.3 6.6 4 2 6.7z' fill='%231E5AA8'/&gt;&lt;/svg&gt;" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" />
<style>
  :root {
    --paper: #F7F4ED;
    --sky: #B8D7EB;
    --blue: #1E5AA8;
    --brick: #D47A54;
    --stone: #C8C2B4;
    --ink: #2B2B2B;
    --muted: #5F5C57;
    --font: "Bricolage Grotesque", system-ui, "Helvetica Neue", Arial, sans-serif;
    --serif: var(--font);
    --sans: var(--font);
    --mono: var(--font);
  }
  html, body { margin: 0; padding: 0; background: #F7F4ED; color: #2B2B2B; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #2B2B2B; text-decoration: none; }
  a:hover { color: #1E5AA8; }
  input, button { font-family: inherit; }
  ::selection { background: #B8D7EB; }

  .sky-bar {
    position: sticky; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 22px;
    padding: 22px clamp(20px, 4.5vw, 64px);
    background: #B8D7EB;
  }
  .wordmark {
    margin-right: auto; background: transparent; border: 0; padding: 0; cursor: pointer;
    color: #2B2B2B;
    font-family: var(--sans);
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -.02em;
    line-height: 1;
  }
  .wordmark:hover { color: #2B2B2B; }
  .sky-bar .nav-wide {
    font-size: 14px; color: #2B2B2B; background: transparent; border: 0;
    padding: 12px 4px; cursor: pointer;
  }
  .sky-bar .nav-wide:hover { color: #1E5AA8; }

  .who {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px clamp(20px, 4.5vw, 64px) 0;
    font-size: 14px;
    color: #5F5C57;
  }
  .who:empty { display: none; }
  .who button {
    background: none; border: 0; padding: 0;
    color: #5F5C57; cursor: pointer; font-size: inherit;
  }
  .who button:hover { color: #1E5AA8; }

  .desk {
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(28px, 4vw, 48px) clamp(20px, 4.5vw, 64px) 80px;
    display: grid;
    grid-template-columns: minmax(200px, 260px) minmax(0, 1fr);
    gap: 36px 56px;
    align-items: start;
  }
  @media (max-width: 760px) { .desk { grid-template-columns: 1fr; gap: 28px; } }

  .side h2, .main h1, .gate h1 {
    font-family: var(--serif); font-weight: 400; letter-spacing: -.02em; margin: 0 0 8px;
  }
  .side h2 { font-size: clamp(28px, 3.6vw, 36px); }
  .main h1 { font-size: clamp(32px, 4.4vw, 44px); line-height: 1.04; }
  .lede { margin: 0 0 22px; font-size: 15px; line-height: 1.5; color: #5F5C57; max-width: 42ch; }
  .lede a { color: #1E5AA8; }
  .mono {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: #5F5C57;
  }

  .group { margin: 22px 0 0; padding-bottom: 8px; }
  .item {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-top: 1px solid #C8C2B4;
    padding: 13px 0; margin: 0; cursor: pointer; color: inherit;
  }
  .item:last-of-type { border-bottom: 1px solid #C8C2B4; }
  .item:hover, .item.on { color: #1E5AA8; }
  .item b { display: block; font-weight: 500; font-size: 15px; margin: 0 0 3px; }
  .item span { font-size: 13px; color: #5F5C57; }
  .item:hover span, .item.on span { color: inherit; }
  .empty-side { font-size: 15px; color: #5F5C57; line-height: 1.5; padding: 8px 0; }
  .new {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; padding: 8px 0;
    color: #5F5C57; cursor: pointer; font-size: 14px; margin: 4px 0 6px;
  }
  .new:hover { color: #1E5AA8; }

  .card { background: transparent; border: 0; padding: 0; }
  .stack { display: grid; gap: 12px; }
  .lbl {
    display: grid; gap: 7px; text-align: left;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: #5F5C57;
  }
  .field {
    width: 100%; font-size: 15px; padding: 13px 15px; border-radius: 10px;
    border: 1px solid #C8C2B4; background: #F7F4ED; color: #2B2B2B; outline: none;
  }
  .field:focus { border-color: #1E5AA8; }
  .drop {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    border: 1px dashed #C8C2B4; border-radius: 10px; padding: 13px 15px;
    cursor: pointer; background: #F7F4ED; font-size: 14px; color: #5F5C57;
  }
  .drop:hover, .drop.over { border-color: #1E5AA8; }
  .drop i { font-style: normal; color: #2B2B2B; }
  .drop em { font-style: normal; font-size: 14px; color: #5F5C57; }
  .err { display: none; margin: 0 0 12px; font-size: 12.5px; color: #A93521; }
  /* Shiny CTA on primary pills. Keep in sync with index.html.
     Solid #1E5AA8 is the fallback when @property / conic animation is missing. */
  @property --gradient-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @property --gradient-angle-offset { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @property --gradient-percent { syntax: "<percentage>"; initial-value: 5%; inherits: false; }
  @property --gradient-shine { syntax: "<color>"; initial-value: white; inherits: false; }
  @keyframes gradient-angle { to { --gradient-angle: 360deg; } }
  @keyframes shimmer { to { rotate: 360deg; } }
  .pill {
    --shiny-cta-bg: #1E5AA8;
    --shiny-cta-bg-subtle: #17457F;
    --shiny-cta-fg: #ffffff;
    --shiny-cta-highlight: #B8D7EB;
    --shiny-cta-highlight-subtle: #D4E7F3;
    --animation: gradient-angle linear infinite;
    --duration: 3s;
    --shadow-size: 2px;
    --transition: 800ms cubic-bezier(0.25, 1, 0.5, 1);
    isolation: isolate;
    position: relative;
    overflow: hidden;
    display: inline-block;
    font-size: 15px;
    font-weight: 500;
    color: var(--shiny-cta-fg);
    background: #1E5AA8;
    background:
      linear-gradient(var(--shiny-cta-bg), var(--shiny-cta-bg)) padding-box,
      conic-gradient(
        from calc(var(--gradient-angle) - var(--gradient-angle-offset)),
        transparent,
        var(--shiny-cta-highlight) var(--gradient-percent),
        var(--gradient-shine) calc(var(--gradient-percent) * 2),
        var(--shiny-cta-highlight) calc(var(--gradient-percent) * 3),
        transparent calc(var(--gradient-percent) * 4)
      ) border-box;
    padding: 14px 26px;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    outline-offset: 4px;
    box-shadow: inset 0 0 0 1px var(--shiny-cta-bg-subtle);
    transition: var(--transition);
    transition-property: --gradient-angle-offset, --gradient-percent, --gradient-shine;
    animation: var(--animation) var(--duration), var(--animation) calc(var(--duration) / 0.4) reverse paused;
    animation-composition: add;
  }
  .pill::before, .pill::after {
    content: "";
    pointer-events: none;
    position: absolute;
    inset-inline-start: 50%;
    inset-block-start: 50%;
    translate: -50% -50%;
    z-index: -1;
    animation: var(--animation) var(--duration), var(--animation) calc(var(--duration) / 0.4) reverse paused;
    animation-composition: add;
  }
  .pill::before {
    --size: calc(100% - var(--shadow-size) * 3);
    --position: 2px;
    --space: calc(var(--position) * 2);
    width: var(--size);
    height: var(--size);
    background: radial-gradient(circle at var(--position) var(--position), white calc(var(--position) / 4), transparent 0) padding-box;
    background-size: var(--space) var(--space);
    background-repeat: space;
    mask-image: conic-gradient(from calc(var(--gradient-angle) + 45deg), black, transparent 10% 90%, black);
    border-radius: inherit;
    opacity: 0.4;
  }
  .pill::after {
    --animation: shimmer linear infinite;
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(-50deg, transparent, var(--shiny-cta-highlight), transparent);
    mask-image: radial-gradient(circle at bottom, transparent 40%, black);
    opacity: 0.6;
  }
  .pill:active { translate: 0 1px; }
  .pill:is(:hover, :focus-visible) {
    --gradient-percent: 20%;
    --gradient-angle-offset: 95deg;
    --gradient-shine: var(--shiny-cta-highlight-subtle);
    color: #fff;
  }
  .pill:is(:hover, :focus-visible),
  .pill:is(:hover, :focus-visible)::before,
  .pill:is(:hover, :focus-visible)::after { animation-play-state: running; }
  .pill:disabled, .pill:disabled::before, .pill:disabled::after { animation: none; }
  .pill:disabled { opacity: .5; cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    .pill, .pill::before, .pill::after { animation: none; }
    .pill:active { translate: none; }
  }
  .ghost, .more-btn {
    background: none; border: 0; padding: 8px 0; color: #5F5C57;
    cursor: pointer; font-size: 14px;
  }
  .ghost:hover, .more-btn:hover { color: #1E5AA8; }
  .progress { display: none; height: 4px; border-radius: 999px; background: #C8C2B4; overflow: hidden; margin-top: 14px; }
  .progress > i { display: block; width: 0; height: 100%; background: #1E5AA8; }

  .status { font-family: var(--serif); font-size: clamp(22px, 2.4vw, 28px); line-height: 1.2; margin: 0 0 8px; }
  .facts { display: grid; gap: 6px 20px; margin: 16px 0; font-size: 14.5px; color: #5F5C57; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 7px; margin-top: 16px; }
  /* display:block — an inline <a> ignores aspect-ratio and collapses to a sliver. */
  .thumbs a { display: block; aspect-ratio: 4/3; border-radius: 8px; background: #F7F4ED center/cover no-repeat; border: 1px solid #C8C2B4; }
  .thumbs a:hover { outline: 2px solid #1E5AA8; outline-offset: 1px; }

  .gate { max-width: 520px; margin: 10vh auto 20vh; padding: 0 clamp(20px, 4.5vw, 64px); }
  .gate h1 { font-size: clamp(32px, 4.4vw, 48px); line-height: 1.04; margin: 0 0 12px; }
  .gate p { font-size: 15px; line-height: 1.55; color: #5F5C57; margin: 0 0 18px; }
  .gate .pill { margin-top: 4px; }
  .gate .field { margin: 0 0 12px; }
  .gate a { color: #1E5AA8; }

  .band-sky { background: #B8D7EB; }
  .foot-bar {
    max-width: 1400px; margin: 0 auto;
    padding: 28px 24px 40px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .foot-bar .wordmark { margin-right: 0; font-size: 15px; }
  .foot-bar p {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em; margin: 0;
  }
  .foot-bar a { color: inherit; }
  .foot-bar a:hover { color: #1E5AA8; }

  @media (max-width: 860px) {
    header a, header button { min-height: 44px; }
    .foot-bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <header class="sky-bar">
    <a class="wordmark" href="/">Corridor</a>
    <a class="nav-wide" href="/#pricing">Pricing</a>
    <a class="nav-wide" href="/#faq">FAQ</a>
    <a class="nav-wide" href="/listings">Account</a>
  </header>
  <p class="who" id="who"></p>
  <div id="app"></div>
  <footer class="band-sky">
    <div class="foot-bar">
      <a class="wordmark" href="/">Corridor</a>
      <p>DETROIT · MAX@CORRIDOR.VIDEO · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
    </div>
  </footer>
<script>
(function () {
  var MIN = 12, MAX = 40;
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var account = null;
  var listings = [];
  var selected = null;
  var files = [];

  var $ = function (s, root) { return (root || document).querySelector(s); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function working(l) { return /^(new|in progress|cutting)$/.test(l.status); }

  function boot() {
    fetch('/api/auth/me', { credentials: 'same-origin' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        account = data && data.account;
        if (!account) return drawGate();
        $('#who').innerHTML = esc(account.email) + ' · <button type="button" id="out">Sign out</button>';
        $('#out').onclick = function () {
          fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
            .finally(function () { location.href = '/'; });
        };
        return loadList().then(drawDesk);
      })
      .catch(function () { drawGate(); });
  }

  function loadList() {
    return fetch('/api/auth/listings', { credentials: 'same-origin' })
      .then(function (res) {
        if (res.status === 401) { drawGate(); return; }
        return res.json();
      })
      .then(function (data) {
        if (!data) return;
        listings = data.listings || [];
        if (selected) selected = listings.find(function (l) { return l.id === selected.id; }) || null;
      });
  }

  function drawGate() {
    $('#who').innerHTML = '';
    $('#app').innerHTML =
      '<div class="gate">' +
        '<h1>Your listings</h1>' +
        '<p>Already sent a listing? Enter the email you used.</p>' +
        '<input id="gate-email" class="field" type="email" autocomplete="email" placeholder="you@brokerage.com">' +
        '<p class="err" id="gate-err"></p>' +
        '<button type="button" class="pill" id="gate-go">Continue</button>' +
        '<p style="margin-top:28px"><a href="/#intake">Or send a listing</a></p>' +
      '</div>';
    var go = $('#gate-go'), err = $('#gate-err'), email = $('#gate-email');
    function send() {
      var v = (email.value || '').trim();
      if (!EMAIL_RE.test(v)) { err.textContent = 'Enter the email you used on the order.'; err.style.display = 'block'; return; }
      go.disabled = true; go.textContent = 'One moment…'; err.style.display = 'none';
      fetch('/api/auth/link', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: v })
      }).then(function (res) { return res.json().then(function (d) { return { res: res, d: d }; }); })
        .then(function (out) {
          if (!out.res.ok || !(out.d && out.d.success)) throw new Error((out.d && out.d.error) || 'Could not send that.');
          $('.gate p').textContent = 'Check that inbox — the link opens your listings.';
          email.style.display = 'none'; go.style.display = 'none';
        })
        .catch(function (e) {
          err.textContent = e.message; err.style.display = 'block';
          go.disabled = false; go.textContent = 'Continue';
        });
    }
    go.onclick = send;
    email.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  }

  function sideList(title, items) {
    if (!items.length) return '';
    return '<p class="mono group">' + esc(title) + '</p>' + items.map(function (l) {
      return '<button type="button" class="item' + (selected && selected.id === l.id ? ' on' : '') + '" data-id="' + esc(l.id) + '">' +
        '<b>' + esc(l.address || 'Listing') + '</b>' +
        '<span>' + esc(l.label) + (when(l.createdAt) ? ' · ' + when(l.createdAt) : '') + '</span>' +
      '</button>';
    }).join('');
  }

  function drawDesk() {
    var open = listings.filter(working);
    var past = listings.filter(function (l) { return !working(l); });
    $('#app').innerHTML =
      '<div class="desk">' +
        '<aside class="side">' +
          '<h2>Your listings</h2>' +
          '<button type="button" class="new" id="new-listing">Upload listing</button>' +
          (listings.length
            ? sideList('Working on', open) + sideList('Past', past)
            : '<p class="empty-side">Nothing yet. Upload a listing and it will show up here.</p>') +
        '</aside>' +
        '<main class="main" id="main"></main>' +
      '</div>';
    $('#new-listing').onclick = function () { selected = null; drawDesk(); };
    Array.prototype.forEach.call(document.querySelectorAll('.item'), function (el) {
      el.onclick = function () {
        selected = listings.find(function (l) { return l.id === el.getAttribute('data-id'); }) || null;
        drawDesk();
      };
    });
    if (selected) drawStatus();
    else drawUpload();
  }

  function drawStatus() {
    var l = selected;
    var photos = l.photos || [];
    $('#main').innerHTML =
      '<p class="mono">Listing</p>' +
      '<h1>' + esc(l.address || 'Listing') + '</h1>' +
      '<p class="status">' + esc(l.label) + '</p>' +
      '<div class="facts">' +
        (when(l.createdAt) ? '<div>Sent ' + esc(when(l.createdAt)) + '</div>' : '') +
        '<div>' + (l.photoCount || photos.length || 0) + ' photo' + ((l.photoCount || photos.length || 0) === 1 ? '' : 's') + '</div>' +
        (l.size ? '<div>' + esc(l.size) + ' SF</div>' : '') +
      '</div>' +
      (l.notes ? '<p class="lede">' + esc(l.notes) + '</p>' : '') +
      (photos.length
        ? '<div class="thumbs">' + photos.map(function (u) {
            return '<a href="' + esc(u) + '" target="_blank" rel="noopener" style="background-image:url(' + esc(u) + ')"></a>';
          }).join('') + '</div>'
        : '') +
      '<p style="margin-top:22px"><button type="button" class="ghost" id="back">Upload another listing</button></p>';
    $('#back').onclick = function () { selected = null; drawDesk(); };
  }

  function drawUpload() {
    var needName = !(account && account.name);
    $('#main').innerHTML =
      '<div class="card stack">' +
        '<h1>Upload listing</h1>' +
        '<p class="lede">Address and photos. We already have you as ' + esc(account.email) + '.</p>' +
        (needName ? '<label class="lbl">Your name<input id="name" class="field" type="text" autocomplete="name" placeholder="Your name"></label>' : '') +
        '<label class="lbl">Property address<input id="address" class="field" type="text" placeholder="6432 Woodward Ave, Detroit, MI"></label>' +
        '<label class="lbl">Photos · 12 to 40' +
          '<span class="drop" id="drop"><input id="photos" type="file" multiple accept="image/jpeg,image/png,image/webp" style="display:none">' +
          '<i>Choose photos</i><em id="photo-label">12 to 40 · crooked phone shots welcome</em></span>' +
        '</label>' +
        '<p class="err" id="form-err"></p>' +
        '<button type="button" class="pill" id="go">Upload listing</button>' +
        '<p class="lede" style="margin:14px 0 0">Upload trouble? Email the photos to <a href="mailto:max@corridor.video">max@corridor.video</a>.</p>' +
        '<div class="progress" id="bar"><i id="bar-fill"></i></div>' +
      '</div>';

    var input = $('#photos'), drop = $('#drop'), label = $('#photo-label'), go = $('#go'), err = $('#form-err');
    function setFiles(list) {
      files = Array.prototype.slice.call(list || []).filter(function (f) { return /^image\/(jpeg|png|webp)$/i.test(f.type); });
      label.textContent = files.length
        ? files.length + ' photo' + (files.length === 1 ? '' : 's') + ' ready'
        : '12 to 40 · crooked phone shots welcome';
    }
    drop.onclick = function () { input.click(); };
    input.onchange = function () { setFiles(input.files); };
    drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = function () { drop.classList.remove('over'); };
    drop.ondrop = function (e) {
      e.preventDefault(); drop.classList.remove('over');
      setFiles(e.dataTransfer && e.dataTransfer.files);
    };

    go.onclick = function () {
      var address = ($('#address').value || '').trim();
      var name = needName ? (($('#name').value || '').trim()) : (account.name || '');
      if (needName && !name) { err.textContent = 'Tell us who to send it back to.'; err.style.display = 'block'; return; }
      if (!address) { err.textContent = 'The property address is required.'; err.style.display = 'block'; return; }
      if (files.length < MIN) { err.textContent = 'We need at least ' + MIN + ' photos.'; err.style.display = 'block'; return; }
      if (files.length > MAX) { err.textContent = 'Send your best ' + MAX + ' photos.'; err.style.display = 'block'; return; }
      err.style.display = 'none';
      go.disabled = true; go.textContent = 'Sending…';
      $('#bar').style.display = 'block';

      var fd = new FormData();
      fd.append('name', name);
      fd.append('email', account.email);
      fd.append('address', address);
      files.forEach(function (f) { fd.append('photos', f, f.name); });

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/intake');
      xhr.timeout = 10 * 60 * 1000;
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var pct = Math.round((e.loaded / e.total) * 100);
        $('#bar-fill').style.width = pct + '%';
        go.textContent = pct < 100 ? 'Sending… ' + pct + '%' : 'Almost there…';
      };
      xhr.onload = function () {
        var data = null;
        try { data = JSON.parse(xhr.responseText || '{}'); } catch (e) {}
        if (xhr.status >= 200 && xhr.status < 300 && data && data.success) {
          if (needName && name) account.name = name;
          files = [];
          loadList().then(function () {
            selected = listings[0] || null;
            drawDesk();
          });
          return;
        }
        err.textContent = (data && data.error) || 'We could not take that listing. Try again.';
        err.style.display = 'block';
        go.disabled = false; go.textContent = 'Upload listing';
      };
      xhr.onerror = function () {
        err.textContent = 'That did not reach us. Check your connection and try again.';
        err.style.display = 'block';
        go.disabled = false; go.textContent = 'Upload listing';
      };
      xhr.send(fd);
    };
  }

  boot();
})();
</script>
</body>
</html>
