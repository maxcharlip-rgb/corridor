<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tour not found</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div style="display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center">
    <div>
      <div style="font-size:34px;color:var(--accent);margin-bottom:10px">▶</div>
      <h1 style="margin:0 0 8px;font-size:22px;font-weight:640;letter-spacing:-0.02em">Tour not found</h1>
      <p style="color:var(--muted);max-width:44ch;line-height:1.6;margin:0">

      </p>
    </div>
  </div>
</body>
</html>
