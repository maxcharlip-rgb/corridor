<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corridor Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232B4FD7'/><path d='M11 8v16l11-8z' fill='%23F5F3EE'/></svg>" />
  <style>
    :root {
      --paper: #F5F3EE; --card: #fff; --ink: #101418; --slate: #55606E; --mute: #8A8778;
      --line: #E4E0D6; --line-2: #EFEDE6; --navy: #101E33; --accent: #2B4FD7; --accent-2: #1F3BB0;
      --tint: #E7ECFB; --good: #1E7A4D; --bad: #A93521;
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: var(--ink); }
    a:hover { color: var(--accent); }
    input, select, textarea, button { font-family: inherit; }
    ::selection { background: #D9E1FB; }

    .top { position: sticky; top: 0; z-index: 40; background: rgba(245,243,238,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .top-in { max-width: 1160px; margin: 0 auto; padding: 13px 20px; display: flex; align-items: center; gap: 16px; }
    .mark { display: flex; align-items: center; gap: 9px; }
    .mark i { width: 13px; height: 22px; background: var(--accent); border-radius: 7px 7px 2px 2px; display: block; }
    .mark span { font-family: var(--serif); font-size: 24px; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: clamp(22px, 4vw, 40px) 20px clamp(60px, 8vw, 96px); }

    h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 4vw, 44px); line-height: 1.04; letter-spacing: -.02em; margin: 0 0 8px; }
    h2 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.1; margin: 0 0 8px; }
    p.lede { font-size: 16px; line-height: 1.55; color: var(--slate); margin: 0 0 24px; max-width: 58ch; }
    .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(18px, 3vw, 26px); }
    .card.navy { background: var(--navy); color: #fff; border-color: var(--navy); }
    .card.navy .lede, .card.navy p { color: #C4CEE0; }
    .card.navy .mono { color: #8FA6D8; }

    .btn { font-size: 15px; padding: 14px 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
    .btn:hover { border-color: var(--ink); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
    .btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 500; }
    .btn.dark:hover { background: var(--accent); border-color: var(--accent); }
    .btn.sm { font-size: 13.5px; padding: 9px 15px; }
    .btn.link { border: 0; background: none; padding: 6px 0; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); }
    .btn.link:hover { color: var(--accent); }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    .steps { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: clamp(20px, 3vw, 32px); }
    .steps b { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 400; color: #B4B0A2; padding-bottom: 5px; border-bottom: 2px solid transparent; }
    .steps b.done { color: var(--slate); }
    .steps b.on { color: var(--ink); border-bottom-color: var(--accent); }
    .steps i { width: 18px; height: 1px; background: #C9C5B8; display: block; }

    .drop { display: block; border: 1px dashed #C9C5B8; background: var(--card); border-radius: 22px; padding: clamp(26px, 5vw, 44px) 24px; text-align: center; cursor: pointer; }
    .drop:hover, .drop.over { border-color: var(--accent); }
    .drop b { display: block; font-size: 17px; margin-bottom: 8px; }
    .drop span { display: block; font-size: 14.5px; color: var(--slate); margin-bottom: 20px; }

    .grid { display: grid; gap: 12px; }
    .photos { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .photo { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .photo .thumb { aspect-ratio: 4/3; background-size: cover; background-position: center; background-color: #EFEDE6; }
    .photo .meta { padding: 8px 10px 10px; display: grid; gap: 7px; }
    .photo select { width: 100%; font-size: 12px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
    .photo .x { position: relative; top: -0px; font-size: 11px; color: var(--mute); background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
    .photo .x:hover { color: var(--bad); }

    .field { display: grid; gap: 7px; }
    .field > span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
    .field input, .field select, .field textarea { width: 100%; font-size: 15px; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); outline: none; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); background: var(--card); }
    .field textarea { line-height: 1.55; resize: vertical; }
    .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

    .chip { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; color: var(--slate); background: var(--tint); border-radius: 999px; padding: 7px 12px; border: 0; }
    .chip.btnish { cursor: pointer; }
    .chip.btnish:hover { color: var(--accent); }

    .player { position: relative; aspect-ratio: 16/9; border-radius: 18px; overflow: hidden; border: 1px solid #D8D3C7; background: repeating-linear-gradient(135deg, #DDD9CE 0 8px, #EAE7DE 8px 16px); display: flex; align-items: center; justify-content: center; }
    .player video { width: 100%; height: 100%; object-fit: cover; background: #0B1626; }
    .bar { height: 6px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(to right, var(--accent), #6FE3A6); transition: width .4s linear; }
    .list { display: grid; gap: 10px; }
    .list .r { display: flex; align-items: center; gap: 12px; font-size: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); }
    .list .r span:first-child { font-family: var(--mono); font-size: 11px; color: var(--mute); }
    .list .r em { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--slate); }

    .cols { display: flex; flex-wrap: wrap; gap: clamp(16px, 2.5vw, 26px); align-items: flex-start; }
    .col-main { flex: 2 1 420px; min-width: 0; }
    .col-side { flex: 1 1 290px; min-width: 0; }
    .sticky { position: sticky; top: 84px; }

    .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(400px, 100%); z-index: 80; background: var(--card); border-left: 1px solid var(--line); box-shadow: -20px 0 60px rgba(16,20,24,.12); display: none; flex-direction: column; }
    .drawer.open { display: flex; }
    .drawer .head, .drawer .foot { padding: 16px 18px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 10px; }
    .drawer .foot { border-bottom: 0; border-top: 1px solid var(--line-2); display: grid; gap: 10px; }
    .drawer .body { flex: 1; overflow-y: auto; padding: 18px; display: grid; gap: 14px; align-content: start; }
    .msg { display: grid; gap: 6px; }
    .msg span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
    .msg p { font-size: 14.5px; line-height: 1.6; margin: 0; background: var(--paper); border-radius: 12px; padding: 11px 13px; }
    .msg.me p { background: var(--tint); }
    .x-btn { font-size: 16px; line-height: 1; color: var(--slate); background: none; border: 1px solid var(--line); width: 30px; height: 30px; border-radius: 999px; cursor: pointer; }
    .x-btn:hover { border-color: var(--ink); color: var(--ink); }

    .note { font-size: 13.5px; line-height: 1.5; color: var(--slate); }
    .err { font-size: 13.5px; line-height: 1.5; color: var(--bad); }
    .toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; justify-items: center; }
    .toast { background: var(--navy); color: #fff; font-size: 13.5px; padding: 11px 18px; border-radius: 999px; box-shadow: 0 14px 40px rgba(7,16,28,.3); }
    .toast.bad { background: var(--bad); }
    .tours { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .tour { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; cursor: pointer; text-align: left; }
    .tour:hover { border-color: var(--accent); }
    .tour b { display: block; font-size: 13.5px; font-weight: 500; }
    .tour small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--mute); }
    .center { max-width: 460px; margin: 8vh auto 0; }
    .visuals { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .visual { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
    .visual .im { aspect-ratio: 4/3; background: repeating-linear-gradient(135deg, #E7E4DA 0 7px, #F3F1EA 7px 14px); background-size: cover; background-position: center; }
    .visual .cap { padding: 9px 11px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  
.takes{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 0 10px 34px}
.takes .mono{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8A94A3;margin-right:2px}
.take{font:inherit;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid #D9D5CB;background:#fff;color:#2A3038;cursor:pointer}
.take:hover:not(:disabled){border-color:#2B4FD7;color:#2B4FD7}
.take.on{background:#2B4FD7;border-color:#2B4FD7;color:#fff}
.take.bad{border-color:#E2B4AE;color:#B4544A;cursor:not-allowed}
.take.busy{color:#8A94A3;cursor:default}
.take-preview{width:100%;max-width:360px;border-radius:10px;margin-top:6px;display:block}

.spec-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.spec-row input{font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);outline:none;min-width:0}
.spec-row input:focus{border-color:var(--accent);background:var(--card)}
.spec-x{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;padding:0 12px;cursor:pointer;font-size:12px}
.spec-x:hover{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
  <div class="top">
    <div class="top-in">
      <div class="mark"><i></i><span>Corridor</span></div>
      <div style="margin-left:auto" class="row" id="top-right"></div>
    </div>
  </div>

  <div class="wrap" id="app"></div>

  <div id="gen-modal" style="display:none;position:fixed;inset:0;z-index:80;background:rgba(16,20,24,.55);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px">
    <div style="background:#fff;border-radius:22px;padding:30px;width:min(440px,100%);box-shadow:0 30px 80px rgba(0,0,0,.25)">
      <p class="mono" id="gen-kicker" style="margin:0 0 10px">Generating</p>
      <h2 id="gen-title" style="margin:0 0 6px">Cutting your tour</h2>
      <p class="note" id="gen-sub" style="margin:0 0 20px">Sequencing the photos and rendering each move.</p>
      <div class="bar" style="height:8px"><i id="gen-bar" style="width:0%"></i></div>
      <div class="row" style="margin-top:12px">
        <span class="mono" id="gen-count" style="margin-right:auto">0 of 0 shots</span>
        <span class="mono" id="gen-pct">0%</span>
      </div>
      <button class="btn link" id="gen-hide" style="width:100%;text-align:center;margin-top:16px">Hide — keep working</button>
    </div>
  </div>

  <div class="drawer" id="chat">
    <div class="head">
      <span class="mono" style="margin-right:auto">Refine this tour</span>
      <button class="x-btn" id="chat-close" aria-label="Close">&times;</button>
    </div>
    <div class="body" id="chat-body"></div>
    <div class="foot">
      <div class="row" id="chat-chips"></div>
      <div class="row" style="gap:9px">
        <input id="chat-input" placeholder="Tell Corridor what to change…" style="flex:1;min-width:0;font-size:14.5px;padding:12px 15px;border-radius:999px;border:1px solid var(--line);background:var(--paper);outline:none" />
        <button class="btn primary sm" id="chat-send">Send</button>
      </div>
      <button class="btn dark" id="chat-apply">Apply &amp; re-render</button>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

<script>
/* Corridor Studio — the whole broker workflow in one page.
   Photos → details → generate → refine/concepts → share.
   Talks only to the existing API; no routes were added for this UI. */

var S = { account: null, authEnabled: false, boot: null, listing: null, photos: [], shots: [],
          step: 'photos', chat: [], visuals: [], poll: null, visualPoll: null, reelUrl: null,
          share: null, busy: false };

var $ = function (sel, root) { return (root || document).querySelector(sel); };
var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
  return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };

function toast(message, kind) {
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = message;
  $('#toasts').appendChild(el);
  setTimeout(function () { el.remove(); }, kind === 'bad' ? 6500 : 3200);
}


/* ---- take picker -----------------------------------------------------------
   Roughly 2 shots in 5 come back with a defect (invented signage, an inverted
   camera move), so several takes are generated per shot. Without a way to
   choose between them you pay for three and use whichever landed first, which
   is the whole benefit thrown away. Click a number to preview it, click the
   same number again to make it the one the tour and reel use. -------------- */
function takeStrip(s) {
  var takes = s.takes || [];
  if (takes.length < 2) return '';
  var done = takes.filter(function (t) { return t.file; }).length;
  var chips = takes.map(function (t, i) {
    if (t.error) return '<button class="take bad" disabled title="' + esc(t.error) + '">' + (i + 1) + ' \u2715</button>';
    if (!t.file) return '<button class="take busy" disabled>' + (i + 1) + '\u2026</button>';
    var on = s.selectedTakeId === t.id;
    return '<button class="take' + (on ? ' on' : '') + '" data-take="' + t.id + '" data-shot="' + s.id +
      '" data-url="/renders/' + esc(t.file) + '">' + (i + 1) + (on ? ' \u2713' : '') + '</button>';
  }).join('');
  return '<div class="takes"><span class="mono">takes ' + done + '/' + takes.length + '</span>' + chips +
    '<video class="take-preview" data-for="' + s.id + '" controls playsinline hidden></video></div>';
}

async function wireTakes() {
  document.querySelectorAll('[data-take]').forEach(function (b) {
    b.onclick = async function () {
      var vid = document.querySelector('.take-preview[data-for="' + b.dataset.shot + '"]');
      if (b.dataset.playing === '1') {
        try {
          await api('/shots/' + b.dataset.shot + '/select-take', { method: 'POST', body: { takeId: b.dataset.take } });
          toast('Take selected \u2014 it will be used in the tour and reel.');
          await refresh();
        } catch (e) { toast(e.message); }
        return;
      }
      document.querySelectorAll('[data-take]').forEach(function (x) { x.dataset.playing = '0'; });
      b.dataset.playing = '1';
      if (vid) { vid.src = b.dataset.url; vid.hidden = false; vid.play().catch(function () {}); }
      toast('Playing this take. Click it again to use it.');
    };
  });
}

async function api(path, options) {
  options = options || {};
  var init = { credentials: 'same-origin', method: options.method || 'GET' };
  if (options.body instanceof FormData) init.body = options.body;
  else if (options.body) { init.headers = { 'Content-Type': 'application/json' }; init.body = JSON.stringify(options.body); }
  var res = await fetch('/api' + path, init);
  var text = await res.text();
  var data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}

/* ---------------------------------------------------------------- boot + auth */

async function boot() {
  try {
    var me = await api('/auth/me');
    S.account = me.account; S.authEnabled = me.authEnabled;
  } catch (e) { render(offline(e.message)); return; }

  if (S.authEnabled && !S.account) return renderAuth();

  try { S.boot = await api('/bootstrap'); }
  catch (e) { render(offline(e.message)); return; }

  /* Which tour to open. An explicit ?listing=<id> wins — that is how the landing
     page hands off the tour it just created and uploaded into. Otherwise open the
     most RECENTLY touched one: listings[0] is the oldest, so defaulting to it
     meant a tour you had just started never appeared. */
  var wanted = new URLSearchParams(location.search).get('listing');
  var pick = null;
  if (wanted) pick = S.boot.listings.filter(function (l) { return l.id === wanted; })[0] || null;
  if (!pick) {
    pick = S.boot.listings.slice().sort(function (a, b) {
      return String(b.updatedAt || b.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || ''));
    })[0] || null;
  }
  if (pick) {
    await openListing(pick.id);
    /* Arriving from the landing page: show the photos step so the broker SEES
       what they just uploaded. openListing otherwise skips ahead to details as
       soon as photos exist, which lands them on a form with no confirmation
       their upload worked — the exact complaint that the photos "don't make it
       into the platform". */
    if (wanted) { S.step = 'photos'; draw(); }
  } else render(stepPhotos());
  paintTop();
}

function offline(message) {
  return '<div class="center card"><h2>Corridor can\'t reach the server</h2>' +
    '<p class="note">' + esc(message) + '</p>' +
    '<p class="note">Start it with <code>npm start</code> and reload — the studio only talks to your own API.</p></div>';
}

function renderAuth() {
  render('<div class="center card">' +
    '<h1 style="font-size:32px">Sign in</h1>' +
    '<p class="lede">Your tours, share links and concept images.</p>' +
    '<div class="grid" style="gap:10px">' +
      '<label class="field"><span>Email</span><input id="a-email" type="email" autocomplete="email" /></label>' +
      '<label class="field"><span>Password</span><input id="a-pass" type="password" autocomplete="current-password" /></label>' +
      '<div id="a-extra" style="display:none" class="two">' +
        '<label class="field"><span>Your name</span><input id="a-name" type="text" /></label>' +
        '<label class="field"><span>Brokerage</span><input id="a-company" type="text" /></label>' +
      '</div>' +
      '<p class="err" id="a-err" style="display:none"></p>' +
      '<button class="btn primary" id="a-go" style="width:100%">Sign in</button>' +
      '<button class="btn link" id="a-toggle" style="text-align:center">Create an account</button>' +
    '</div></div>');

  var mode = 'login';
  var err = $('#a-err');
  $('#a-toggle').onclick = function () {
    mode = mode === 'login' ? 'signup' : 'login';
    $('#a-extra').style.display = mode === 'signup' ? 'grid' : 'none';
    $('#a-go').textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    $('#a-toggle').textContent = mode === 'signup' ? 'I already have an account' : 'Create an account';
    err.style.display = 'none';
  };
  $('#a-go').onclick = async function () {
    $('#a-go').disabled = true; err.style.display = 'none';
    try {
      await api('/auth/' + mode, { method: 'POST', body: {
        email: $('#a-email').value, password: $('#a-pass').value,
        name: $('#a-name') ? $('#a-name').value : '', company: $('#a-company') ? $('#a-company').value : ''
      }});
      location.reload();
    } catch (e) { err.textContent = e.message; err.style.display = 'block'; $('#a-go').disabled = false; }
  };
  $('#a-pass').onkeydown = function (e) { if (e.key === 'Enter') $('#a-go').click(); };
}

function paintTop() {
  var credits = S.boot && S.boot.credits;
  var left = credits && credits.budget ? (credits.budget - credits.usedThisMonth) + ' credits left' : null;
  $('#top-right').innerHTML =
    (left ? '<span class="mono">' + esc(left) + '</span>' : '') +
    '<button class="btn sm" id="t-new">New tour</button>' +
    (S.account ? '<button class="btn link" id="t-out">Sign out</button>' : '');
  if ($('#t-new')) $('#t-new').onclick = newTour;
  if ($('#t-out')) $('#t-out').onclick = async function () {
    await api('/auth/logout', { method: 'POST' }); location.reload();
  };
}

/* ------------------------------------------------------------------- render */

function render(html) { $('#app').innerHTML = html; }

function steps() {
  var order = ['photos', 'details', 'generate', 'share'];
  var labels = { photos: '01 Photos', details: '02 Details', generate: '03 Generate', share: '04 Share' };
  var at = order.indexOf(S.step);
  return '<div class="steps">' + order.map(function (key, i) {
    var cls = i === at ? 'on' : (i < at ? 'done' : '');
    return (i ? '<i></i>' : '') + '<b class="' + cls + '">' + labels[key] + '</b>';
  }).join('') +
  '<button class="btn link" id="s-new" style="margin-left:auto">Start a new tour</button></div>';
}

function wireSteps() { if ($('#s-new')) $('#s-new').onclick = newTour; }

function tours() {
  if (!S.boot || !S.boot.listings.length) return '';
  return '<div style="margin-top:36px"><div class="mono" style="margin-bottom:12px">Your tours</div><div class="tours">' +
    S.boot.listings.slice(0, 8).map(function (l) {
      return '<button class="tour" data-open="' + l.id + '">' +
        '<b>' + esc(l.name) + '</b><small>' + l.shotCount + ' stops · ' + (l.published ? 'published' : 'draft') + '</small></button>';

}

function wireTours() {

  });
}

/* --------------------------------------------------------------- 01  photos */

/* Paste (\u2318V / Ctrl+V). Brokers copy images straight out of Dropbox, Preview,
   Slack or an email and paste them. With no handler that silently did nothing,
   which reads as "the upload is broken". Clipboard images arrive as File objects
   on the paste event, so they go through the exact same upload path as
   drag-drop and the file picker. */
function wirePaste() {
  if (window.__corridorPaste) return;
  window.__corridorPaste = true;
  document.addEventListener('paste', function (e) {
    if (/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName)) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && /^image\//.test(items[i].type)) {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (!files.length) return;
    e.preventDefault();
    if (S.step !== 'photos') { S.step = 'photos'; draw(); }
    upload(files);
  });
}

function stepPhotos() {
  var has = S.photos.length;
  var spaces = (S.boot && S.boot.spaceTypes) || [];
  return steps() +
    '<h1>' + (has ? S.photos.length + ' photos in' : 'Start with the photos you already have') + '</h1>' +
    '<p class="lede">' + (has
      ? 'Corridor guessed each space from the filename. Fix any that are wrong — it changes the order and the camera move.'
      : 'Twelve to forty of them. Exterior, lobby, floor plate, amenities. Crooked phone shots are fine.') + '</p>' +
    '<label class="drop" id="drop">' +
      '<input type="file" id="files" multiple accept="image/*" hidden />' +
      '<span class="mono" style="display:block;margin-bottom:10px">DRAG IN \u00B7 CLICK TO BROWSE \u00B7 OR PASTE WITH \u2318V</span>' +
      '<b>Drop photos here, or click to choose</b>' +
      '<span>JPEG, PNG or WebP · up to 25 MB each</span>' +
      '<span class="btn primary" style="display:inline-block">Upload photos</span>' +
    '</label>' +
    (has ? '<div class="row" style="margin:22px 0 14px"><span class="mono" style="margin-right:auto">' +
        S.photos.length + ' photos ready</span>' +
        '<button class="btn primary" id="to-details">Next: listing details →</button></div>' +
      '<div class="grid photos">' + S.photos.map(function (p) {
        return '<div class="photo"><div class="thumb" style="background-image:url(\'/uploads/' + esc(p.file) + '\')"></div>' +
          '<div class="meta"><select data-space="' + p.id + '">' +
            spaces.map(function (s) { return '<option value="' + s.key + '"' + (s.key === p.spaceType ? ' selected' : '') + '>' + esc(s.label) + '</option>'; }).join('') +
          '</select><button class="x" data-del="' + p.id + '">Remove</button></div></div>';
      }).join('') + '</div>' : tours());
}

function wirePhotos() {
  var input = $('#files'), zone = $('#drop');
  if (input) input.onchange = function () { upload(Array.prototype.slice.call(input.files)); };
  if (zone) {
    ['dragenter', 'dragover'].forEach(function (ev) { zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove('over'); }); });
    zone.addEventListener('drop', function (e) { upload(Array.prototype.slice.call(e.dataTransfer.files)); });
  }
  if ($('#to-details')) $('#to-details').onclick = function () { S.step = 'details'; draw(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-space]'), function (el) {
    el.onchange = async function () {
      try { await api('/photos/' + el.getAttribute('data-space'), { method: 'PATCH', body: { spaceType: el.value } }); await refresh(); }
      catch (e) { toast(e.message, 'bad'); }
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (el) {
    el.onclick = async function () {
      try { await api('/photos/' + el.getAttribute('data-del'), { method: 'DELETE' }); await refresh(); }
      catch (e) { toast(e.message, 'bad'); }
    };
  });
  wireTours();
}

async function upload(files) {
  var images = files.filter(function (f) { return /^image\//.test(f.type); });
  if (!images.length) return;
  try {
    if (!S.listing) {
      var created = await api('/listings', { method: 'POST', body: { name: 'Untitled tour', propertyType: 'office' } });
      S.listing = created;
    }
    var form = new FormData();
    images.forEach(function (f) { form.append('photos', f); });
    toast('Uploading ' + images.length + ' photo' + (images.length > 1 ? 's' : '') + '…');
    var up = await api('/listings/' + S.listing.id + '/photos', { method: 'POST', body: form });
    await refresh();
    /* A partial upload must not read as a complete one. The server keeps the
       good photos and reports the rest; say which were skipped and why. */
    var skipped = (up && up.rejected) || [];
    if (skipped.length) {
      toast(skipped.length + ' skipped \u2014 ' + skipped[0].reason, 'bad');
    } else {
      toast('Photos in. Next: a few details.');
    }
  } catch (e) { toast(e.message, 'bad'); }
}

/* -------------------------------------------------------------- 02  details */

/* Facts a CRE prospect actually asks for. One click adds the row, the broker
   fills the value. Deliberately short \u2014 a spec line with nine items is
   unreadable at 1080p. These double as the fact whitelist: a number not entered
   here is stripped from any caption before it reaches a viewer. */
var SPEC_PRESETS = ['Available SF', 'Asking rate', 'Parking', 'Clear height', 'Year built', 'Divisible to', 'Occupancy'];

function specRows(specs) {
  var rows = (specs && specs.length ? specs : []).map(function (sp, i) { return specRow(sp.label, sp.value, i); });
  if (!rows.length) rows.push(specRow('', '', 0));
  return rows.join('');
}

function specRow(label, value, i) {
  return '<div class="spec-row" data-i="' + i + '">' +
    '<input class="spec-label" placeholder="Available SF" value="' + esc(label || '') + '" />' +
    '<input class="spec-value" placeholder="24,000" value="' + esc(value || '') + '" />' +
    '<button type="button" class="spec-x" title="Remove">\u2715</button></div>';
}

function collectSpecs() {
  return [].slice.call(document.querySelectorAll('.spec-row')).map(function (r) {
    return { label: r.querySelector('.spec-label').value.trim(), value: r.querySelector('.spec-value').value.trim() };
  }).filter(function (sp) { return sp.label || sp.value; });
}

function wireSpecs() {
  document.querySelectorAll('[data-addspec]').forEach(function (b) {
    b.onclick = function () {
      var host = document.getElementById('spec-rows');
      host.insertAdjacentHTML('beforeend', specRow(b.dataset.addspec, '', host.children.length));
      wireSpecs();
      var rows = host.querySelectorAll('.spec-row');
      var last = rows[rows.length - 1];
      (b.dataset.addspec ? last.querySelector('.spec-value') : last.querySelector('.spec-label')).focus();
    };
  });
  document.querySelectorAll('.spec-x').forEach(function (x) {
    x.onclick = function () { x.closest('.spec-row').remove(); };
  });
}

function stepDetails() {
  var l = S.listing || {};
  var specs = (l.spec && l.spec.specs) || l.specs || [];
  return steps() +
    '<h1>Tell us what we\'re looking at</h1>' +
    '<p class="lede">Thirty seconds of typing. This becomes the narration, the captions and the end card — so vague in, vague out.</p>' +
    '<div class="cols"><div class="col-main"><div class="card grid" style="gap:14px">' +
      '<label class="field"><span>Building name</span><input id="f-name" value="' + esc(l.name === 'Untitled tour' ? '' : l.name || '') + '" placeholder="1011 Commerce Center" /></label>' +
      '<label class="field"><span>Address</span><input id="f-address" value="' + esc(l.address || '') + '" placeholder="1011 Michigan Ave NE, Grand Rapids, MI" /></label>' +
      '<div class="two">' +
        '<label class="field"><span>Property type</span><select id="f-type">' +
          ['office', 'industrial', 'retail', 'medical', 'mixed-use'].map(function (t) {
            return '<option value="' + t + '"' + (l.propertyType === t ? ' selected' : '') + '>' + t.replace('-', ' ') + '</option>';
          }).join('') + '</select></label>' +
        '<label class="field"><span>Headline</span><input id="f-headline" value="' + esc(l.headline || '') + '" placeholder="24,000 SF available · Q1 occupancy" /></label>' +
      '</div>' +
      '<label class="field"><span>Anything else worth saying</span><textarea id="f-notes" rows="4" placeholder="24,000 SF on floors 3–4, divisible to 8,000. $18.50 NNN, available Q1. New lobby last year, 14ft exposed ceilings, covered parking.">' + esc(l.specNotes || '') + '</textarea></label>' +
      '<div class="row"><button class="btn primary" id="d-save">Save details</button>' +
        '<button class="btn" id="d-back">← Photos</button>' +
        '<button class="btn dark" id="d-next" style="margin-left:auto">Next: generate →</button></div>' +
    '</div>' +
    '<div class="card" style="margin-top:16px">' +
      '<div class="row" style="margin-bottom:6px"><span class="mono" style="margin-right:auto">On-screen facts</span></div>' +
      '<p class="note" style="margin:0 0 14px">These get burned into the video \u2014 address over the opening, this line bottom-right throughout, your number at the close. ' +
        'Only numbers entered here can appear on screen: anything Corridor cannot trace back to you is stripped before a viewer sees it.</p>' +
      '<div id="spec-rows">' + specRows(specs) + '</div>' +
      '<div class="row" style="margin-top:10px">' +
        SPEC_PRESETS.map(function (pz) {
          return '<button type="button" class="chip btnish" data-addspec="' + esc(pz) + '">+ ' + esc(pz) + '</button>';
        }).join('') +
        '<button type="button" class="chip btnish" data-addspec="" style="margin-left:auto">+ Custom</button>' +
      '</div>' +
    '</div>' +
    '</div><div class="col-side"><div class="card sticky">' +
      '<h2>What happens next</h2>' +

      '<p class="mono" style="margin:16px 0 0">PLANNING ONLY · SPENDS NOTHING</p>' +
    '</div></div></div>';
}

function wireDetails() {
  $('#d-back').onclick = function () { S.step = 'photos'; draw(); };
  $('#d-save').onclick = function () { saveDetails(true); };

}

async function saveDetails(announce) {

    }});

    }});

/* ------------------------------------------------------------- 03  generate */

function stepGenerate() {
  var cap = (S.boot && S.boot.capabilities) || {};
  var total = S.shots.length;
  var ready = S.shots.filter(function (s) { return s.status === 'ready'; }).length;
  var working = S.shots.filter(function (s) { return s.status === 'queued' || s.status === 'rendering'; }).length;
  var pct = total ? Math.round((ready / total) * 100) : 0;

  return steps() +
    '<h1>' + (working ? 'Cutting your tour' : (total ? 'Your storyboard' : 'Ready when you are')) + '</h1>' +
    '<p class="lede">' + (working
      ? 'Two minutes, give or take. Close the tab if you like — it keeps rendering without you.'
      : 'One button. We plan every shot, cost it, then render. Preview is free and instant; cinematic costs credits and looks like a film crew showed up.') + '</p>' +
    '<div class="cols"><div class="col-main">' +
      (total ? '<div class="card"><div class="row" style="margin-bottom:12px"><span class="mono" style="margin-right:auto">' +
        (working ? 'Rendering' : 'Storyboard') + '</span><span class="mono">' + ready + ' of ' + total + ' shots</span></div>' +
        '<div class="bar" style="margin-bottom:20px"><i style="width:' + pct + '%"></i></div>' +
        '<div class="list">' + S.shots.map(function (s, i) {
          return '<div class="r"><span>' + String(i + 1).padStart(2, '0') + '</span>' +
            '<span style="flex:1;min-width:0">' + esc(s.title || 'Stop') + ' · ' + esc(s.motionLabel || s.motionKey) + '</span>' +
            '<em>' + esc(s.status === 'ready' ? (s.bestQuality || 'ready') : s.status) + '</em></div>' +
            takeStrip(s);
        }).join('') + '</div></div>' : '<div class="card"><p class="note">Nothing planned yet. Hit generate and Corridor will sequence the whole tour from your photos.</p></div>') +
    '</div><div class="col-side"><div class="card navy sticky">' +
      '<h2 style="color:#fff">Generate</h2>' +
      '<div class="grid" style="gap:12px;margin:16px 0 18px">' +
        '<label class="field"><span>Quality</span><select id="g-quality" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff">' +
          '<option value="preview"' + (S.quality !== 'cinematic' ? ' selected' : '') + '>Preview · free, instant</option>' +
          '<option value="cinematic"' + (cap.cinematic ? '' : ' disabled') + (S.quality === 'cinematic' ? ' selected' : '') + '>Cinematic · costs credits' + (cap.cinematic ? '' : ' (add API keys)') + '</option>' +
        '</select></label>' +
        '<label class="field"><span>Pace</span><select id="g-pace" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff">' +
          ((S.boot && S.boot.paces) || [{ key: 'standard', label: 'Standard' }]).map(function (pc) {
            return '<option value="' + esc(pc.key) + '"' + ((S.pace || 'standard') === pc.key ? ' selected' : '') + '>' + esc(pc.label) + '</option>';
          }).join('') +
        '</select></label>' +
        '<label class="field"><span>Takes per shot</span><select id="g-takes" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff">' +
          [1, 3, 4].map(function (n) {
            var lbl = n === 1 ? '1 · cheapest' : (n === 3 ? '3 · recommended' : '4');
            return '<option value="' + n + '"' + (Number(S.takes || 3) === n ? ' selected' : '') + '>' + lbl + '</option>';
          }).join('') +
        '</select></label>' +
      '</div>' +
      '<button class="btn" id="g-go" style="width:100%;background:#fff;border-color:#fff;font-weight:500">' + (working ? 'Rendering…' : 'Generate video') + '</button>' +
      '<button class="btn link" id="g-cost" style="width:100%;text-align:center;color:#8FA6D8">What will this cost?</button>' +
      '<p class="mono" id="g-note" style="margin:8px 0 0">' + (cap.publicUrlIsLocal && cap.cinematic ? 'PUBLIC_URL IS LOCAL — CINEMATIC NEEDS A TUNNEL' : 'PREVIEW RENDERS SPEND NOTHING') + '</p>' +
    '</div></div></div>' +
    (ready ? '<div class="row" style="margin-top:22px"><button class="btn dark" id="g-done">See the finished video →</button></div>' : '');
}

function wireGenerate() {
  if ($('#g-go')) $('#g-go').onclick = generate;
  if ($('#g-cost')) $('#g-cost').onclick = showCost;
  /* Persist the operator's choices. The generate step re-renders on every poll
     tick while shots are rendering, which rebuilt these selects from scratch and
     snapped them back to their defaults — picking "Cinematic" then watching it
     revert a second later, forever, because polling never stops while a shot is
     stuck. Holding the value on S makes the re-render restore it instead. */
  if ($('#g-quality')) $('#g-quality').onchange = function () { S.quality = this.value; };
  if ($('#g-takes')) $('#g-takes').onchange = function () { S.takes = Number(this.value) || 3; };
  if ($('#g-pace')) $('#g-pace').onchange = function () { S.pace = this.value; };

  if ($('#g-done')) $('#g-done').onclick = async function () { S.step = 'share'; await buildReel(); draw(); };
}

async function showCost() {
  try {
    var plan = await api('/listings/' + S.listing.id + '/plan', { method: 'POST', body: {
      notes: S.listing.specNotes || '', takes: Number($('#g-takes').value) || 3,
      pace: (($('#g-pace') || {}).value) || S.pace || 'standard'
    }});
    toast(plan.tour.calls.length + ' shots · ' + plan.total.credits + ' credits ≈ $' + plan.total.approxUsd +
      (plan.total.withinBudget ? '' : ' · over budget'), plan.total.withinBudget ? '' : 'bad');
  } catch (e) { toast(e.message, 'bad'); }
}

/* Generation progress. Rendering runs for minutes; with no visible signal the
   app looks hung, which is how a working pipeline gets reported as broken.
   Live bar, then advances to Share on its own once the last shot lands. */
function genProgress(show) {
  var m = document.getElementById('gen-modal');
  if (!m) return;
  if (show === false) { m.style.display = 'none'; return; }
  if (show === true) m.style.display = 'flex';

  var total = S.shots.length;
  var done = S.shots.filter(function (s) { return s.videoUrl; }).length;
  var failed = S.shots.filter(function (s) { return s.status === 'failed'; }).length;
  var pct = total ? Math.round((done / total) * 100) : 0;

  var bar = document.getElementById('gen-bar');
  if (bar) bar.style.width = pct + '%';
  var c = document.getElementById('gen-count');
  if (c) c.textContent = done + ' of ' + total + ' shots' + (failed ? ' \u00B7 ' + failed + ' failed' : '');
  var p = document.getElementById('gen-pct');
  if (p) p.textContent = pct + '%';

  var sub = document.getElementById('gen-sub');
  if (sub) {
    sub.textContent = (failed && done + failed >= total)
      ? 'Finished with ' + failed + ' shot(s) that could not render.'
      : (done === 0 ? 'Sequencing the photos and rendering each move.'
        : 'Rendering shot ' + Math.min(done + 1, total) + ' of ' + total + '.');
  }
}

function genDone() {
  var done = S.shots.filter(function (s) { return s.videoUrl; }).length;
  genProgress();
  var t = document.getElementById('gen-title');
  if (t) t.textContent = done ? 'Your tour is ready' : 'Nothing rendered';
  setTimeout(async function () {
    genProgress(false);
    if (done) { S.step = 'share'; await buildReel(); draw(); }
  }, 900);
}

async function generate() {
  /* Never fail silently. A bare `return` here meant clicking Generate with no
     tour open did absolutely nothing — no message, no spinner, no error — which
     is indistinguishable from a broken button. */
  if (!S.listing) { toast('Start a tour and add photos first.', 'bad'); S.step = 'photos'; draw(); return; }
  if (!S.photos.length) { toast('Add at least one photo before generating.', 'bad'); S.step = 'photos'; draw(); return; }
  $('#g-go').disabled = true;
  try {
    var out = await api('/listings/' + S.listing.id + '/generate', { method: 'POST', body: {
      quality: (($('#g-quality') || {}).value) || S.quality || 'preview',
      takes: Number((($('#g-takes') || {}).value) || S.takes) || 3,
      withTransitions: true,
      pace: (($('#g-pace') || {}).value) || S.pace || 'standard'
    }});
    S.step = 'generate';
    await refresh();
    genProgress(true);
    startPolling();
  } catch (e) { toast(e.message, 'bad'); $('#g-go').disabled = false; }
}

function startPolling() {
  clearTimeout(S.poll);
  S.poll = setTimeout(async function () {
    await refresh();
    // A shot flips to 'ready' the moment its FIRST take lands, while the others
    // are still generating — so polling must also wait on outstanding takes,
    // otherwise takes 2 and 3 never appear without a manual reload.
    var busy = S.shots.some(function (s) {
      if (s.status === 'queued' || s.status === 'rendering') return true;
      return (s.takes || []).some(function (t) { return t.requestId && !t.file && !t.error; });
    });
    genProgress();
    if (busy) return startPolling();
    var gm = document.getElementById('gen-modal');
    if (gm && gm.style.display === 'flex') genDone();
    var ready = S.shots.filter(function (s) { return s.status === 'ready'; }).length;
    if (ready) { toast('Tour rendered.'); S.step = 'share'; await buildReel(); draw(); }
  }, 2500);
}

/* ---------------------------------------------------------------- 04  share */

    '<div class="cols" style="margin-top:26px">' +

          '<select id="v-style" style="font-size:14px;padding:11px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper)"></select>' +

          '<button class="btn primary sm" id="v-go">Create concept images</button>' +
        '</div>' +
        '<div class="visuals" id="v-list"></div>' +
      '</div>' +
      '<div class="col-side card"><h2>Stops</h2><div class="list" style="margin-top:12px">' +
        stops.map(function (s, i) { return '<div class="r"><span>' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span style="flex:1;min-width:0">' + esc(s.title || 'Stop') + '</span><em>' + (s.durationSec || 5) + 's</em></div>'; }).join('') +
      '</div></div>' +
    '</div>' + tours();
}

function wireShare() {
  $('#sh-publish').onclick = publish;
  $('#sh-qr').onclick = loadSignKit;
  $('#sh-rebuild').onclick = async function () { S.reelUrl = null; draw(); await buildReel(); draw(); };
  $('#sh-chat').onclick = openChat;
  if ($('#v-mode')) {
    var modes = (S.boot && S.boot.visualizeModes) || [];
    var styles = (S.boot && S.boot.visualStyles) || [];
    $('#v-mode').innerHTML = modes.map(function (m) { return '<option value="' + esc(m.key || m) + '">' + esc(m.label || m.key || m) + '</option>'; }).join('');
    $('#v-style').innerHTML = styles.map(function (s) { return '<option value="' + esc(s.key || s) + '">' + esc(s.label || s.key || s) + '</option>'; }).join('');
    $('#v-cost').onclick = costVisuals;
    $('#v-go').onclick = makeVisuals;
    paintVisuals();
  }
  wireTours();
}

async function buildReel() {
  if (!S.listing) return;
  try {
    var out = await api('/listings/' + S.listing.id + '/reel', { method: 'POST', body: {} });
    S.reelUrl = out.url;
    if ($('#player')) $('#player').innerHTML = '<video src="' + esc(out.url) + '" controls playsinline></video>';
  } catch (e) {
    if ($('#player')) $('#player').innerHTML = '<span class="mono">' + esc(e.message.toUpperCase()) + '</span>';
  }
}

async function publish() {
  try {
    if (!S.listing.published) {
      var out = await api('/listings/' + S.listing.id + '/publish', { method: 'POST', body: { published: true } });
      S.listing.published = true;
      await copy(out.url);
      toast('Published — link copied.');
    } else {
      var kit = S.share || (S.share = await api('/listings/' + S.listing.id + '/signkit'));
      await copy(kit.tourUrl);
      toast('Link copied.');
    }
    draw();
  } catch (e) { toast(e.message, 'bad'); }
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { toast(text); }
}

async function loadSignKit() {
  try {
    var kit = S.share = await api('/listings/' + S.listing.id + '/signkit');
    $('#share-box').innerHTML = '<div class="card"><div class="cols">' +
      '<div style="flex:none;text-align:center"><img src="' + kit.qrPreview + '" alt="Tour QR code" width="150" height="150" style="border-radius:12px;background:#fff;padding:8px" />' +
        '<div class="mono" style="margin-top:8px">SIGN CODE</div></div>' +
      '<div class="col-main"><div class="mono" style="margin-bottom:10px">Print-ready sign artwork</div><div class="row" style="margin-bottom:16px">' +
        kit.formats.map(function (f) { return '<a class="btn sm" href="/api/listings/' + S.listing.id + '/sign.svg?format=' + esc(f.key) + '">' + esc(f.label) + ' · ' + f.widthIn + '×' + f.heightIn + 'in</a>'; }).join('') +
      '</div><div class="mono" style="margin-bottom:10px">Tagged links</div><div class="grid" style="gap:8px">' +
        kit.links.map(function (link) { return '<div class="row" style="gap:8px"><span style="font-size:13.5px;min-width:110px">' + esc(link.label) + '</span>' +
          '<input readonly value="' + esc(link.url) + '" style="flex:1;min-width:0;font-family:var(--mono);font-size:11px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)" />' +
          '<button class="btn sm" data-copy="' + esc(link.url) + '">Copy</button></div>'; }).join('') +
      '</div>' + (kit.published ? '' : '<p class="note" style="margin-top:14px">Not published yet — these links 404 until you publish.</p>') +
      '</div></div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (el) {
      el.onclick = function () { copy(el.getAttribute('data-copy')); toast('Copied.'); };
    });
  } catch (e) { toast(e.message, 'bad'); }
}

/* ------------------------------------------------------------ concept images */

async function costVisuals() {
  try {
    var plan = await api('/listings/' + S.listing.id + '/visualize/plan', { method: 'POST', body: {
      mode: $('#v-mode').value, style: $('#v-style').value, variants: 2
    }});
    toast(plan.calls.length + ' images · ' + plan.estimate.totalCredits + ' credits' + (plan.withinBudget ? '' : ' · over budget'),
      plan.withinBudget ? '' : 'bad');
  } catch (e) { toast(e.message, 'bad'); }
}

async function makeVisuals() {
  $('#v-go').disabled = true;
  try {
    await api('/listings/' + S.listing.id + '/visualize', { method: 'POST', body: {
      mode: $('#v-mode').value, style: $('#v-style').value, variants: 2
    }});
    toast('Concepts queued.');
    pollVisuals();
  } catch (e) { toast(e.message, 'bad'); }
  $('#v-go').disabled = false;
}

async function pollVisuals() {
  try {
    var out = await api('/listings/' + S.listing.id + '/visuals');
    S.visuals = out.visuals || [];
    paintVisuals();
    if (S.visuals.some(function (v) { return v.status === 'queued' || v.status === 'rendering'; })) {
      clearTimeout(S.visualPoll);
      S.visualPoll = setTimeout(pollVisuals, 4000);
    }
  } catch (e) { /* transient */ }
}

function paintVisuals() {
  var host = $('#v-list');
  if (!host) return;
  if (!S.visuals.length) { host.innerHTML = '<p class="note">No concepts yet.</p>'; return; }
  host.innerHTML = S.visuals.map(function (v) {
    var url = v.url || (v.file ? '/renders/' + v.file : null);
    return '<div class="visual"><div class="im"' + (url ? ' style="background-image:url(\'' + esc(url) + '\')"' : '') + '></div>' +
      '<div class="cap">' + esc(v.title || v.mode) + ' · ' + esc(v.status) + (v.requiresDisclosure ? ' · illustrative' : '') + '</div></div>';
  }).join('');
}

/* --------------------------------------------------------------------- chat */

function openChat() {
  $('#chat').classList.add('open');
  if (!S.chat.length) {
    S.chat = [{ who: 'Corridor', text: 'First cut is done. Tell me what to change — length, order, what to say about a room. I\'ll update the plan, then you hit re-render.' }];
  }
  paintChat();
}

function paintChat() {
  $('#chat-body').innerHTML = S.chat.map(function (m) {
    return '<div class="msg' + (m.who === 'You' ? ' me' : '') + '"><span>' + esc(m.who) + '</span><p>' + esc(m.text) + '</p></div>';
  }).join('');
  $('#chat-body').scrollTop = $('#chat-body').scrollHeight;
  $('#chat-chips').innerHTML = [
    'Make it 60 seconds', 'Open on the rooftop', 'Lead with the floor plate'
  ].map(function (t) { return '<button class="chip btnish" data-chip="' + esc(t) + '">' + esc(t) + '</button>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-chip]'), function (el) {
    el.onclick = function () { sendChat(el.getAttribute('data-chip')); };
  });
}

async function sendChat(text) {
  text = (text || $('#chat-input').value || '').trim();
  if (!text || !S.listing) return;
  $('#chat-input').value = '';
  S.chat.push({ who: 'You', text: text });
  paintChat();
  try {
    // Refinements go through the spec agent — the same planning call the
    // details step uses, so nothing is spent until you re-render.
    var notes = [S.listing.specNotes || '', text].filter(Boolean).join('\n');
    var out = await api('/listings/' + S.listing.id + '/specs', { method: 'POST', body: { notes: notes } });
    S.listing = out.listing;
    var specs = (out.spec && out.spec.specs) || [];
    S.chat.push({ who: 'Corridor', text: 'Got it. Plan updated' + (specs.length ? ' — ' + specs.length + ' specs on file' : '') +
      '. Hit “Apply & re-render” and only the tour rebuilds; the share link stays the same.' });
  } catch (e) {
    S.chat.push({ who: 'Corridor', text: 'That didn\'t land: ' + e.message });
  }
  paintChat();
}

async function applyChat() {
  try {
    $('#chat-apply').disabled = true;
    var out = await api('/listings/' + S.listing.id + '/generate', { method: 'POST', body: { quality: 'preview', withTransitions: true } });
    S.chat.push({ who: 'Corridor', text: 'Re-rendering ' + out.shots + ' shots. This panel can stay open.' });
    paintChat();
    S.reelUrl = null; S.step = 'generate'; draw();
    await refresh(); startPolling();
  } catch (e) { toast(e.message, 'bad'); }
  $('#chat-apply').disabled = false;
}

/* ------------------------------------------------------------------ plumbing */

async function newTour() {
  clearTimeout(S.poll);
  S.listing = null; S.photos = []; S.shots = []; S.visuals = []; S.chat = [];
  S.reelUrl = null; S.share = null; S.step = 'photos';
  draw();
}

async function openListing(listingId) {
  try {
    var data = await api('/listings/' + listingId);
    S.listing = data.listing; S.photos = data.photos; S.shots = data.shots;
    S.reelUrl = data.listing.reelFile ? '/renders/' + data.listing.reelFile : null;
    S.visuals = data.listing.visuals || [];
    var ready = S.shots.filter(function (s) { return s.status === 'ready'; }).length;
    var busy = S.shots.some(function (s) { return s.status === 'queued' || s.status === 'rendering'; });
    S.step = busy ? 'generate' : (ready ? 'share' : (S.photos.length ? 'details' : 'photos'));
    draw();
    if (busy) startPolling();
    if (S.visuals.some(function (v) { return v.status === 'queued'; })) pollVisuals();
  } catch (e) { toast(e.message, 'bad'); }
}

async function refresh(skipDraw) {
  try {
    /* Capabilities must load even with no listing open. They used to be fetched
       only inside the listing branch, so S.boot stayed undefined on any path
       that had no listing yet — and the generate step reads
       cap.cinematic from it. Undefined reads as falsy, so Cinematic rendered
       DISABLED with "(add API keys)" even when the server had valid keys and
       reported cinematic:true. The control was unclickable for a reason that
       had nothing to do with the keys. */
    S.boot = await api('/bootstrap');
    if (!S.listing) { if (!skipDraw) { paintTop(); draw(); } return; }
    var data = await api('/listings/' + S.listing.id);
    S.listing = data.listing; S.photos = data.photos; S.shots = data.shots;
    if (data.listing.reelFile) S.reelUrl = '/renders/' + data.listing.reelFile;
    paintTop();
    if (!skipDraw) draw();
  } catch (e) { /* transient — the next action resyncs */ }
}

function draw() {
  if (S.step === 'photos') { render(stepPhotos()); wireSteps(); wirePhotos(); }
  else if (S.step === 'details') { render(stepDetails()); wireSteps(); wireDetails(); wireSpecs(); }
  else if (S.step === 'generate') { render(stepGenerate()); wireSteps(); wireGenerate(); wireTakes(); }
  else { render(stepShare()); wireSteps(); wireShare(); }
}

var genHide = document.getElementById('gen-hide');
if (genHide) genHide.onclick = function () { genProgress(false); };
wirePaste();
$('#chat-close').onclick = function () { $('#chat').classList.remove('open'); };
$('#chat-send').onclick = function () { sendChat(); };
$('#chat-apply').onclick = applyChat;
$('#chat-input').onkeydown = function (e) { if (e.key === 'Enter') sendChat(); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('#chat').classList.remove('open'); });

boot();
</script>
</body>
</html>
