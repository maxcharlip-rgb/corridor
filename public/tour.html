<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listing tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Archivo:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 24'&gt;&lt;path d='M2.4 23V10.6a8.6 8.6 0 0 1 17.2 0V23' stroke='%231E5AA8' stroke-width='2.4' fill='none' stroke-linecap='round'/&gt;&lt;path d='M8.6 8.4 15.4 12l-6.8 3.6z' fill='%231E5AA8'/&gt;&lt;/svg&gt;" />
  <style>
    /* Same light Corridor surface as the marketing homepage.
       The video well stays dark so the cut can read; the page around it does not. */
    :root {
      --paper: #F7FAFD;
      --sky: #D6E6F5;
      --ink: #2B2B2B;
      --muted: #5F5C57;
      --muted-2: #8A857C;
      --line: #D6E6F5;
      --line-soft: #D6E6F5;
      --blue: #1E5AA8;
      --blue-deep: #17457F;
      --brick: #C45A3A;
      --stone: #C8C2B4;
      --sans: "Archivo", system-ui, "Helvetica Neue", Arial, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #F7FAFD; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; position: relative; }
    /* Quieter crop of the same street: sky only, fading into paper. */
    .sky-wash {
      position: absolute; top: 0; left: 0; right: 0; height: 280px;
      overflow: hidden; z-index: 0; pointer-events: none; background: #D6E6F5;
    }
    .sky-wash img {
      width: 100%; height: 360px; object-fit: cover; object-position: 18% 6%; display: block;
    }
    .sky-wash::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(214,230,245,.15) 0%, rgba(247,250,253,.55) 55%, #F7FAFD 100%);
    }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--blue); }
    button, input, textarea { font: inherit; color: inherit; }
    ::selection { background: #D3E3F6; }

    .bar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(214,230,245,.82);
      border-bottom: 1px solid rgba(43,43,43,.1);
    }
    .bar-inner {
      max-width: 1160px; margin: 0 auto; padding: 13px 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 9px; color: var(--ink); }
    .brand:hover { color: var(--ink); }
    .brand svg { display: block; color: var(--blue); }
    .brand span { font-family: var(--serif); font-size: 28px; }
    .bar-listing { margin-left: auto; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 36ch; }
    .bar .btn { flex: none; }

    .wrap { position: relative; z-index: 1; max-width: 1160px; margin: 0 auto; padding: 28px 20px 72px; }

    .note {
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
      margin: 0 0 22px; padding: 14px 0;
      border-bottom: 1px solid #C8C2B4; background: transparent;
    }
    .note p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--ink); }
    .note a { color: var(--blue); font-weight: 500; }

    header.top { margin: 0 0 22px; }
    header.top .kicker {
      font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--blue); margin: 0 0 10px;
    }
    header.top h1 {
      margin: 0; font-family: var(--serif); font-size: clamp(32px, 5vw, 52px);
      font-weight: 400; letter-spacing: -.03em; line-height: 1.02;
    }
    header.top .addr { color: var(--muted); font-size: 15px; margin-top: 8px; }
    header.top .headline { margin-top: 8px; font-size: 16px; color: var(--blue); }

    .stage {
      position: relative; background: #2B2B2B; border-radius: 24px; overflow: hidden;
      aspect-ratio: 16 / 9; box-shadow: 0 18px 48px rgba(43, 43, 43, .08);
    }
    .stage video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .segments { display: flex; gap: 4px; position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px 0; z-index: 3; }
    .seg { flex: 1; height: 3px; background: rgba(255,255,255,.22); border-radius: 2px; overflow: hidden; cursor: pointer; }
    .seg i { display: block; height: 100%; width: 0; background: #fff; }
    .seg.done i { width: 100%; }

    .overlay {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 64px 22px 20px;
      background: linear-gradient(transparent, rgba(10,16,24,.78));
      display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;
      pointer-events: none;
    }
    .overlay .cap { pointer-events: auto; color: #fff; }
    .overlay .stop-name { font-family: var(--serif); font-size: 26px; letter-spacing: -.02em; }
    .overlay .stop-sub { color: rgba(255,255,255,.7); font-size: 13.5px; margin-top: 3px; }
    .overlay .controls { display: flex; gap: 8px; pointer-events: auto; }

    .staged-badge {
      position: absolute; top: 28px; right: 14px; z-index: 3;
      background: rgba(10,16,24,.66); border: 1px solid rgba(255,255,255,.22);
      color: #fff; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
      padding: 5px 10px; border-radius: 999px; text-transform: uppercase;
    }

    .big-play {
      position: absolute; inset: 0; z-index: 4; display: grid; place-items: center;
      background: rgba(10,16,24,.36); cursor: pointer; border: none; width: 100%; color: inherit;
    }
    .big-play span {
      width: 76px; height: 76px; border-radius: 50%; background: var(--blue);
      display: grid; place-items: center; color: #fff; font-size: 24px; padding-left: 4px;
      box-shadow: 0 16px 40px rgba(16, 30, 51, .28);
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
      background: #fff; cursor: pointer; font-size: 14px; font-weight: 500;
      transition: background .14s ease, border-color .14s ease, color .14s ease;
    }
    .btn:hover { border-color: var(--ink); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
    .overlay .btn, .stage .btn {
      background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); color: #fff;
    }
    .overlay .btn:hover, .stage .btn:hover { background: rgba(255,255,255,.2); }

    .proof {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      margin: 22px 0 0;
    }
    .proof article {
      border-top: 1px solid #C8C2B4; background: transparent; padding: 18px 0 8px;
    }
    .proof h3 {
      margin: 0 0 6px; font-family: var(--mono); font-size: 10.5px;
      letter-spacing: .16em; text-transform: uppercase; color: var(--blue); font-weight: 500;
    }
    .proof p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }

    .below { display: grid; grid-template-columns: 1fr 320px; gap: 26px; margin-top: 28px; align-items: start; }
    .rooms-label {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--blue); margin: 0 0 12px; font-weight: 500;
    }

    .stops { display: flex; flex-direction: column; gap: 6px; }
    .stop {
      display: grid; grid-template-columns: 92px 1fr auto; gap: 13px; align-items: center;
      padding: 8px; border-radius: 14px; cursor: pointer; border: 1px solid transparent;
      transition: background .14s ease, border-color .14s ease;
    }
    .stop:hover { background: #fff; border-color: var(--line-soft); }
    .stop.active { background: #fff; border-color: var(--brick); }
    .stop .th { aspect-ratio: 16/9; border-radius: 8px; background: var(--sky) center/cover no-repeat; }
    .stop .nm { font-weight: 560; font-size: 14.5px; letter-spacing: -.01em; }
    .stop .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .stop .dur { color: var(--muted-2); font-size: 12px; font-variant-numeric: tabular-nums; }
    .stop.active .nm { color: var(--brick); }

    .card { background: #F7FAFD; border-top: 1px solid #C8C2B4; border-radius: 0; padding: 20px 0; }
    .card + .card { margin-top: 12px; }
    .card h3 {
      margin: 0 0 12px; font-family: var(--mono); font-size: 10.5px;
      letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500;
    }

    .spec { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(43,43,43,.08); font-size: 14px; }
    .spec:last-child { border-bottom: none; }
    .spec .k { color: var(--muted); }
    .spec .v { font-weight: 600; }

    .broker .nm { font-family: var(--serif); font-size: 22px; letter-spacing: -.02em; }
    .broker .co { color: var(--muted); font-size: 13.5px; margin: 2px 0 10px; }
    .broker a { display: block; font-size: 14px; color: var(--blue); margin-top: 4px; }

    .modal-bg { position: fixed; inset: 0; background: rgba(10,16,24,.5); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 60; padding: 20px; }
    .modal { background: var(--paper); border: 1px solid var(--line-soft); border-radius: 24px; padding: 24px; width: min(460px, 100%); box-shadow: 0 34px 90px rgba(7,16,28,.34); }
    .modal h2 { margin: 0 0 5px; font-family: var(--serif); font-size: 28px; font-weight: 400; letter-spacing: -.02em; }
    .modal p.sub { margin: 0 0 18px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
    .modal label { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .modal .f { margin-bottom: 13px; }
    .modal input, .modal textarea {
      width: 100%; padding: 12px 14px; background: #fff;
      border: 1px solid var(--line); border-radius: 10px; outline: none;
    }
    .modal input:focus, .modal textarea:focus { border-color: var(--blue); }
    .modal textarea { min-height: 78px; resize: vertical; }
    .modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal .err { color: #A93521; font-size: 13px; margin-bottom: 12px; }

    .disclosure { margin-top: 22px; color: var(--muted-2); font-size: 12px; line-height: 1.6; max-width: 78ch; }
    .colophon {
      margin-top: 28px; padding-top: 18px; border-top: 1px solid #C8C2B4;
      font-family: var(--sans); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    }

    @media (max-width: 880px) {
      .below { grid-template-columns: 1fr; }
      .proof { grid-template-columns: 1fr; }
      .bar-listing { display: none; }
      header.top h1 { font-size: 28px; }
      .overlay { padding: 40px 16px 14px; }
      .overlay .stop-name { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="sky-wash" aria-hidden="true">
    <img src="/hero-detroit.jpg" width="1536" height="1024" alt="" />
  </div>
  <div class="bar">
    <div class="bar-inner">
      <a class="brand" href="/">
        <svg width="22" height="24" viewBox="0 0 22 24" fill="none" aria-hidden="true">
          <path d="M2.4 23V10.6a8.6 8.6 0 0 1 17.2 0V23" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path>
          <path d="M8.6 8.4 15.4 12l-6.8 3.6z" fill="currentColor"></path>
        </svg>
        <span>Corridor</span>
      </a>
      <div class="bar-listing" id="bar-listing"></div>
    </div>
  </div>
  <div class="wrap" id="app">
    <div style="color:#5F5C57;padding:48px 0">Loading tour…</div>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="/tour.js"></script>
</body>
</html>
